<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="100%" height="100%">
  <defs>
    <!-- Soft App Icon Drop Shadow -->
    <filter id="app-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E3246" flood-opacity="0.16" />
    </filter>
    <!-- Squircle Clip Path -->
    <clipPath id="icon-squircle">
      <rect x="220" y="90" width="360" height="360" rx="82" ry="82" />
    </clipPath>
  </defs>

  <!-- Clean Page Background -->
  <rect width="800" height="720" fill="#F4F7FA" />

  <!-- App Icon Base (White with Shadow, No Haze) -->
  <rect x="220" y="90" width="360" height="360" rx="82" ry="82" fill="#FFFFFF" filter="url(#app-shadow)" />

  <!-- ================= APP ICON CONTENTS ================= -->
  <g clip-path="url(#icon-squircle)">
    <!-- Solid Crisp Sky -->
    <rect x="220" y="90" width="360" height="360" fill="#FFFFFF" />

    <!-- Subtle Distant Ridge (Flat, No Gradients/Haze) -->
    <polygon points="220,335 305,315 395,322 500,330 580,348 580,450 220,450" fill="#D0E4FF" />

    <!-- LEFT: Observation Tower (Aussichtsturm) -->
    <g stroke="#1E3246" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <!-- Top Spire -->
      <line x1="355" y1="190" x2="355" y2="215" stroke-width="2.2" />
      <line x1="355" y1="215" x2="355" y2="242" stroke-width="3" />
      <!-- Upper narrow A-frame above deck -->
      <line x1="355" y1="216" x2="350" y2="242" stroke-width="1.8" />
      <line x1="355" y1="216" x2="360" y2="242" stroke-width="1.8" />
      <line x1="352" y1="230" x2="358" y2="230" stroke-width="1.5" />
      <!-- Cantilevered Viewing Platform -->
      <polygon points="344,242 371,242 369,246 346,246" fill="#1E3246" stroke="none" />
      <line x1="345" y1="239.5" x2="370" y2="239.5" stroke-width="1.3" />
      <!-- Central Spiral Staircase Column -->
      <line x1="355" y1="246" x2="355" y2="325" stroke-width="3.5" stroke-dasharray="2.5,2" />
      <!-- Triangular A-Frame Lattice Legs -->
      <line x1="349" y1="246" x2="336" y2="325" stroke-width="3" />
      <line x1="361" y1="246" x2="374" y2="325" stroke-width="3" />
      <!-- Horizontal Tiers -->
      <line x1="346" y1="264" x2="364" y2="264" stroke-width="2" />
      <line x1="342" y1="284" x2="368" y2="284" stroke-width="2" />
      <line x1="339" y1="305" x2="371" y2="305" stroke-width="2" />
      <!-- K-Bracing -->
      <line x1="349" y1="246" x2="355" y2="264" stroke-width="1.8" />
      <line x1="361" y1="246" x2="355" y2="264" stroke-width="1.8" />
      <line x1="346" y1="264" x2="355" y2="284" stroke-width="1.8" />
      <line x1="364" y1="264" x2="355" y2="284" stroke-width="1.8" />
      <line x1="342" y1="284" x2="355" y2="305" stroke-width="1.8" />
      <line x1="368" y1="284" x2="355" y2="305" stroke-width="1.8" />
    </g>

    <!-- RIGHT: TV Tower (Fernsehturm) -->
    <g fill="#1E3246">
      <!-- Topmost thin antenna -->
      <rect x="448.5" y="138" width="2.5" height="30" />
      <!-- Upper-mid antenna -->
      <rect x="447.5" y="168" width="4.5" height="36" />
      <!-- Lower-mid antenna -->
      <rect x="446.5" y="204" width="6.5" height="34" />
      <!-- Small technical rings -->
      <rect x="444.5" y="224" width="10.5" height="2.5" rx="1" />
      <rect x="444.5" y="229" width="10.5" height="2.5" rx="1" />
      <!-- Upper concrete shaft -->
      <rect x="445.5" y="238" width="8.5" height="18" />
      <!-- Main single low-mounted circular pod -->
      <polygon points="437,254 462,254 460,262 439,262" />
      <rect x="440.5" y="251.5" width="18.5" height="2.5" />
      <polygon points="441,262 458,262 454.5,265.5 444.5,265.5" />
      <!-- Main lower concrete shaft -->
      <polygon points="444.5,265.5 454.5,265.5 455.5,325 443.5,325" />
    </g>

    <!-- LOW-PROFILE MERGED HILL / RIDGE (Less pronounced peak, clean facets) -->
    <!-- Left Bright Blue Slope -->
    <polygon points="220,362 290,332 365,306 425,302 390,450 220,450" fill="#007AFF" />
    <!-- Middle Bridging Facet -->
    <polygon points="425,302 475,304 580,368 580,450 325,450 385,355" fill="#0062CC" />
    <!-- Right Darker Blue/Slate Facet -->
    <polygon points="475,304 530,335 580,368 580,450 435,450 465,355" fill="#1E3246" opacity="0.35" />

    <!-- Bottom Dark Slate Ground Layer (from reference icon style) -->
    <polygon points="220,412 315,406 435,418 525,412 580,404 580,450 220,450" fill="#1E3246" />
  </g>

  <!-- ================= SPLIT COLOR TYPOGRAPHY ================= -->
  <text x="400" y="590" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="112" font-weight="800" text-anchor="middle" letter-spacing="-3">
    <tspan fill="#007AFF">uet</tspan><tspan fill="#1E3246">lib</tspan>
  </text>
</svg>