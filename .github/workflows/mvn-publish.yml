name: Stage Maven release
on:
  workflow_call:
    inputs:
      pom:
        type: string
        default: pom.xml
        description: Root reactor POM, relative to the checkout.
      java-version:
        type: string
        default: "25"
      system-packages:
        type: string
        default: ""
        description: Space-separated Ubuntu packages installed before Maven, e.g. native runtime libraries.
      native-artifacts:
        type: string
        default: ""
        description: >-
          Space-separated artifact names uploaded by earlier jobs of the calling run. Each is required
          and its contents are merged into src/main/resources/native before Maven runs.
      environment:
        type: string
        default: maven-central
        description: Protected environment in the calling repository.
      create-github-release:
        type: boolean
        default: true
    secrets:
      UB_ARTIFACTORY_USER:
        required: false
      UB_ARTIFACTORY_PASSWORD:
        required: false
      UB_ARTIFACTORY_URL:
        required: false
      UB_ARTIFACTORY_REPO_UBIQUE:
        required: false
      UETLIB_MAVEN_CENTRAL_USERNAME:
        required: false
        description: Central Portal token username. May instead be supplied by the environment.
      UETLIB_MAVEN_CENTRAL_PASSWORD:
        required: false
        description: Central Portal token password. May instead be supplied by the environment.
      SYSTEMS_UBIQUE_SIGNING_KEY_ARMOR_ASC:
        required: false
        description: ASCII-armored private signing key. May instead be supplied by the environment.
      SYSTEMS_UBIQUE_SIGNING_KEY_PASSPHRASE:
        required: false
        description: Signing key passphrase. May instead be supplied by the environment.
permissions:
  contents: read
concurrency:
  group: central-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!context.ref.startsWith('refs/tags/v')) {
              throw new Error('Publishing requires a v* release tag');
            }
            const version = context.ref.slice('refs/tags/v'.length);
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(version) || /SNAPSHOT/i.test(version)) {
              throw new Error('Tag must contain a release version, never a snapshot');
            }
            // Starter-parent versions include a stable calendar suffix, e.g. 4.1.1-2026.11.0.
            const prerelease = version.includes('-') && !/^\d+\.\d+\.\d+-\d{4}\.\d+\.\d+$/.test(version);
            if (!prerelease) {
              const fs = require('fs');
              if (!fs.existsSync('CHANGELOG.md')) {
                throw new Error(`Stable release ${version} requires CHANGELOG.md`);
              }
              const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
              const heading = lines.findIndex(line => {
                const match = line.match(/^#{1,6}\s+(\S+)/);
                return match && match[1].replace(/^\[|\]$/g, '').replace(/^v/, '') === version;
              });
              if (heading < 0) throw new Error(`CHANGELOG.md needs a heading for ${version}`);
              const level = lines[heading].match(/^#+/)[0].length;
              const nextHeading = new RegExp(`^#{1,${level}}\\s+`);
              const rest = lines.slice(heading + 1);
              const end = rest.findIndex(line => nextHeading.test(line));
              const entry = end < 0 ? rest : rest.slice(0, end);
              if (!entry.some(line => line.trim() && !/^#{1,6}\s/.test(line))) {
                throw new Error(`CHANGELOG.md entry for ${version} must not be empty`);
              }
            }
            core.setOutput('version', version);
            core.setOutput('prerelease', String(prerelease));
  publish:
    name: Stage release in Artifactory
    needs: validate
    uses: ./.github/workflows/mvn-install.yml
    with:
      pom: ${{ inputs.pom }}
      java-version: ${{ inputs.java-version }}
      system-packages: ${{ inputs.system-packages }}
      native-artifacts: ${{ inputs.native-artifacts }}
      release-version: ${{ needs.validate.outputs.version }}
    secrets: inherit
  release:
    name: Create GitHub release
    if: ${{ inputs.create-github-release }}
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(release create "$TAG" --verify-tag --generate-notes --title "$TAG")
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
