name: Build
on:
  push:
    branches: [ '**' ]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test workflow scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-tests"
          "$RUNNER_TEMP/workflow-tests/bin/pip" install -r tests/requirements.txt
          "$RUNNER_TEMP/workflow-tests/bin/python" -m unittest discover -s tests -v

      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Check settings script
        run: shellcheck enable-gh-settings.sh
