name: Maven install
on:
  workflow_call:
    inputs:
      pom:
        type: string
        default: pom.xml
        description: Root reactor POM, relative to the checkout.
      java-version:
        type: string
        default: "25"
      sonar:
        type: boolean
        default: false
        description: Run SonarCloud analysis after the build and tests.
      system-packages:
        type: string
        default: ""
        description: Space-separated Ubuntu packages installed before Maven, e.g. native runtime libraries.
      native-artifacts:
        type: string
        default: ""
        description: >-
          Space-separated artifact names uploaded by earlier jobs of the calling run. Each is required
          and its contents are merged into src/main/resources/native before Maven runs.
    secrets:
      SONAR_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system packages
        if: ${{ inputs.system-packages != '' }}
        env:
          PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -ra package_names <<< "$PACKAGES"
          for package in "${package_names[@]}"; do
            if [[ ! "$package" =~ ^[a-z0-9][a-z0-9.+-]*$ ]]; then
              echo "::error::Invalid package name: $package"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${package_names[@]}"
      - name: Download native artifacts
        if: ${{ inputs.native-artifacts != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/native-artifacts
      - name: Stage native artifacts
        if: ${{ inputs.native-artifacts != '' }}
        env:
          ARTIFACTS: ${{ inputs.native-artifacts }}
        run: |
          read -ra artifact_names <<< "$ARTIFACTS"
          mkdir -p src/main/resources/native
          for artifact in "${artifact_names[@]}"; do
            source="$RUNNER_TEMP/native-artifacts/$artifact"
            if [[ ! "$artifact" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || -z "$(ls -A "$source" 2>/dev/null)" ]]; then
              echo "::error::Native artifact $artifact is missing or empty"
              exit 1
            fi
            cp -R "$source/." src/main/resources/native/
          done
          find src/main/resources/native -type f
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Build, test and install
        env:
          POM: ${{ inputs.pom }}
        run: |
          mvn --batch-mode --no-transfer-progress -f "$POM" clean install
      - name: Cache SonarCloud packages
        if: ${{ inputs.sonar }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Run SonarCloud analysis
        if: ${{ inputs.sonar }}
        env:
          POM: ${{ inputs.pom }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mvn --batch-mode --no-transfer-progress -f "$POM" org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
