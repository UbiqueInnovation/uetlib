name: Maven install
on:
  workflow_call:
    inputs:
      pom:
        type: string
        default: pom.xml
        description: Root reactor POM, relative to the checkout.
      java-version:
        type: string
        default: "25"
      release-version:
        type: string
        default: ""
        description: Exact version supplied by the release workflow; empty keeps the POM version.
      sonar:
        type: boolean
        default: false
        description: Run SonarCloud analysis after the build and tests.
      system-packages:
        type: string
        default: ""
        description: Space-separated Ubuntu packages installed before Maven, e.g. native runtime libraries.
      native-artifacts:
        type: string
        default: ""
        description: >-
          Space-separated artifact names uploaded by earlier jobs of the calling run. Each is required
          and its contents are merged into src/main/resources/native before Maven runs.
    secrets:
      UB_ARTIFACTORY_USER:
        required: false
      UB_ARTIFACTORY_PASSWORD:
        required: false
      UB_ARTIFACTORY_URL:
        required: false
      UB_ARTIFACTORY_REPO_UBIQUE:
        required: false
      MAVEN_SIGNING_KEY_ARMOR_ASC:
        required: false
      MAVEN_SIGNING_KEY_PASSPHRASE:
        required: false
      SONAR_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system packages
        if: ${{ inputs.system-packages != '' }}
        env:
          PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -ra package_names <<< "$PACKAGES"
          for package in "${package_names[@]}"; do
            if [[ ! "$package" =~ ^[a-z0-9][a-z0-9.+-]*$ ]]; then
              echo "::error::Invalid package name: $package"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${package_names[@]}"

      - name: Download native artifacts
        if: ${{ inputs.native-artifacts != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/native-artifacts

      - name: Stage native artifacts
        if: ${{ inputs.native-artifacts != '' }}
        env:
          ARTIFACTS: ${{ inputs.native-artifacts }}
        run: |
          read -ra artifact_names <<< "$ARTIFACTS"
          mkdir -p src/main/resources/native
          for artifact in "${artifact_names[@]}"; do
            source="$RUNNER_TEMP/native-artifacts/$artifact"
            if [[ ! "$artifact" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || -z "$(ls -A "$source" 2>/dev/null)" ]]; then
              echo "::error::Native artifact $artifact is missing or empty"
              exit 1
            fi
            cp -R "$source/." src/main/resources/native/
          done
          find src/main/resources/native -type f

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          cache-dependency-path: "**/pom.xml"
          server-id: ubique-artifactory-virtual
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.MAVEN_SIGNING_KEY_ARMOR_ASC || '' }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Enable Artifactory dependency resolution
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        env:
          ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path.home() / '.m2/settings.xml'
          tree = ET.parse(path)
          root = tree.getroot()
          ns = root.tag.removesuffix('settings')
          def node(parent, name, text=None):
              element = ET.SubElement(parent, ns + name)
              element.text = text
              return element
          profile = node(node(root, 'profiles'), 'profile')
          node(profile, 'id', 'artifactory')
          for collection, item in [('repositories', 'repository'), ('pluginRepositories', 'pluginRepository')]:
              repo = node(node(profile, collection), item)
              node(repo, 'id', 'ubique-artifactory-virtual')
              node(repo, 'url', os.environ['ARTIFACTORY_URL'])
              node(node(repo, 'snapshots'), 'enabled', 'true')
          node(node(root, 'activeProfiles'), 'activeProfile', 'artifactory')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PYTHON

      - name: Set release version
        if: ${{ inputs.release-version != '' }}
        env:
          POM: ${{ inputs.pom }}
          VERSION: ${{ inputs.release-version }}
          MAVEN_USERNAME: ${{ secrets.UB_ARTIFACTORY_USER }}
          MAVEN_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
        run: |
          mvn --batch-mode --no-transfer-progress -f "$POM" org.codehaus.mojo:versions-maven-plugin:2.21.0:set "-DnewVersion=$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Build and test pull request
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        env:
          POM: ${{ inputs.pom }}
        run: mvn --batch-mode --no-transfer-progress -f "$POM" clean install

      - name: Build, test and publish to Artifactory
        id: maven
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        env:
          POM: ${{ inputs.pom }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_SIGNING_KEY_ARMOR_ASC }}
          MAVEN_USERNAME: ${{ secrets.UB_ARTIFACTORY_USER }}
          MAVEN_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_SIGNING_KEY_PASSPHRASE }}
        run: |
          : "${MAVEN_USERNAME:?Artifactory username is required}"
          : "${MAVEN_PASSWORD:?Artifactory password is required}"
          : "${ARTIFACTORY_URL:?Artifactory URL is required}"
          version="$(mvn --quiet -f "$POM" help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            : "${MAVEN_GPG_KEY:?Stable releases require the signing key}"
            echo "central_bundle=true" >> "$GITHUB_OUTPUT"
            # Build once: publish the exact signed bundle contents to Artifactory below.
            mvn --batch-mode --no-transfer-progress -f "$POM" -Pcentral-release -Dcentral.publishing.skipUpload=true clean deploy
          else
            mvn --batch-mode --no-transfer-progress -f "$POM" clean deploy "-DaltDeploymentRepository=ubique-artifactory-virtual::$ARTIFACTORY_URL"
          fi

      - name: Store completed Central bundle in Artifactory
        if: ${{ steps.maven.outputs.central_bundle == 'true' }}
        env:
          POM: ${{ inputs.pom }}
          MAVEN_USERNAME: ${{ secrets.UB_ARTIFACTORY_USER }}
          MAVEN_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.error, urllib.request, zipfile
          root = pathlib.Path(os.environ['POM']).parent
          bundles = list(root.glob('**/target/central-publishing/central-bundle.zip'))
          if not bundles:
              raise SystemExit('Stable release did not produce a Central bundle; check central-release profile')
          if len(bundles) != 1:
              raise SystemExit('Expected one reactor bundle, found ' + str(len(bundles)))
          bundle = bundles[0]
          base = os.environ['ARTIFACTORY_URL'].rstrip('/')
          auth = base64.b64encode((os.environ['MAVEN_USERNAME'] + ':' + os.environ['MAVEN_PASSWORD']).encode()).decode()
          def put_immutable(name, data):
              url = base + '/' + name
              headers = {'Authorization': 'Basic ' + auth}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                      if response.read() != data:
                          raise SystemExit('Refusing to overwrite release file: ' + name)
                      return
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              with urllib.request.urlopen(urllib.request.Request(url, data=data, method='PUT', headers=headers)) as response:
                  response.read()
          with zipfile.ZipFile(bundle) as archive:
              files = {name: hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist() if not name.endswith('/')}
              poms = [name for name in files if name.endswith('.pom')]
              if not poms:
                  raise SystemExit('Bundle contains no POMs')
              versions = {pathlib.PurePosixPath(name).parent.name for name in poms}
              if len(versions) != 1:
                  raise SystemExit('Expected one release version per reactor')
              version = versions.pop()
              # Publish exactly the signed files that will later be promoted to Central.
              for name in files:
                  if '..' in pathlib.PurePosixPath(name).parts or name.startswith('/'):
                      raise SystemExit('Invalid bundle path: ' + name)
                  put_immutable(name, archive.read(name))
          manifest = bundle.with_name('manifest.json')
          manifest.write_text(json.dumps({'repository': os.environ['GITHUB_REPOSITORY'], 'commit': os.environ['GITHUB_SHA'], 'version': version, 'sha256': hashlib.sha256(bundle.read_bytes()).hexdigest(), 'files': files}, indent=2) + '\n')
          repo = os.environ['GITHUB_REPOSITORY'].split('/')[1]
          # A completed bundle coordinate is immutable; never replace its receipt or signatures.
          bundle_path = 'ch/uetlib/central-bundles/' + repo + '/' + version + '/' + repo + '-' + version
          try:
              with urllib.request.urlopen(urllib.request.Request(base + '/' + bundle_path + '-manifest.json', headers={'Authorization': 'Basic ' + auth})) as response:
                  previous = json.load(response)
              if previous != json.loads(manifest.read_text()):
                  raise SystemExit('Bundle version already exists; choose a new release version')
              raise SystemExit(0)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          publisher_pom = bundle.with_name('publisher-pom.xml')
          publisher_pom.write_text('<project><modelVersion>4.0.0</modelVersion><groupId>ch.uetlib.central-bundles</groupId><artifactId>publisher</artifactId><version>1</version></project>')
          subprocess.run(['mvn', '--batch-mode', '--no-transfer-progress', '--non-recursive', '-f', str(publisher_pom), 'org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file', '-DrepositoryId=ubique-artifactory-virtual', '-Durl=' + base, '-DgroupId=ch.uetlib.central-bundles', '-DartifactId=' + repo, '-Dversion=' + version, '-Dpackaging=zip', '-Dfile=' + str(bundle), '-Dfiles=' + str(manifest), '-Dclassifiers=manifest', '-Dtypes=json', '-DgeneratePom=true'], check=True)
          PYTHON

      - name: Cache SonarCloud packages
        if: ${{ inputs.sonar }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud analysis
        if: ${{ inputs.sonar }}
        env:
          POM: ${{ inputs.pom }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.UB_ARTIFACTORY_USER }}
          MAVEN_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mvn --batch-mode --no-transfer-progress -f "$POM" org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
