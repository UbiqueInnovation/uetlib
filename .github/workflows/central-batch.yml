name: Publish Central batch
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish after assembly (false only prepares a reviewable bundle).
permissions:
  contents: read
concurrency:
  group: central-batch
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble selected versions
        env:
          UB_ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}
          UB_ARTIFACTORY_REPO_UBIQUE: ${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}
          UB_ARTIFACTORY_USER: ${{ secrets.UB_ARTIFACTORY_USER }}
          UB_ARTIFACTORY_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
        run: python3 scripts/central_batch.py assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-batch
          path: central-batch/
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: central-batch
          path: central-batch/
      - name: Upload one Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.UETLIB_MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.UETLIB_MAVEN_CENTRAL_PASSWORD }}
        run: python3 scripts/central_batch.py publish --name "uetlib-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve deployment receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-deployment-receipt
          path: central-batch/batch.json
